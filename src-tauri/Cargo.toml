[package]
name = "musicrg"
version = "0.1.0"
description = "Reproductor ligero de Apple Music para Windows"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
windows-core = "0.62"

# Binario pequeño y rápido de cargar: menos disco, menos RAM residente.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
