name: build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install

      # Con el secret TAURI_SIGNING_PRIVATE_KEY se firma el instalador (.sig)
      # para el actualizador. Sin él compila igual, solo que sin firma.
      - name: Build
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $tag = "${{ github.ref }}".StartsWith("refs/tags/v")
          if ($tag -and -not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "Falta el secret TAURI_SIGNING_PRIVATE_KEY: un release sin firma no se puede auto-actualizar."
          }
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            npm run build -- --config "$PWD/src-tauri/tauri.updater.json"
          } else {
            Write-Host "::warning::Sin TAURI_SIGNING_PRIVATE_KEY: build sin artefactos del actualizador."
            npm run build
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: MusicRG-windows
          path: |
            src-tauri/target/release/musicrg.exe
            src-tauri/target/release/bundle/nsis/*.exe

      # latest.json es lo que consulta la app instalada para saber si hay versión nueva.
      - name: Generar latest.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$ver" -ne "${{ github.ref_name }}") {
            throw "La etiqueta ${{ github.ref_name }} no coincide con la versión v$ver de tauri.conf.json."
          }
          $exe = Get-Item src-tauri/target/release/bundle/nsis/*-setup.exe
          $sig = (Get-Content "$($exe.FullName).sig" -Raw).Trim()
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($exe.Name)"
          [ordered]@{
            version   = $ver
            notes     = "MusicRG v$ver"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{ signature = $sig; url = $url } }
          } | ConvertTo-Json -Depth 5 | Set-Content latest.json -Encoding utf8
          Get-Content latest.json

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            latest.json
